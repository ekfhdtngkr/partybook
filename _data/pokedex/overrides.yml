  zygarde: 지가르데
  alcremie: 마휘핑
  dudunsparce: 노고고치
  # 같은 forme 값이 종마다 다른 뜻인 폼 (예: Ice — 버드렉스는 백마, 아르세우스는 타입)
  calyrexice: 버드렉스(백마 탄 모습)
  calyrexshadow: 버드렉스(흑마 탄 모습)
