# 한국어 이름 보완 — Showdown 데이터에 없거나 바꾸고 싶은 이름을 Showdown ID(소문자 영숫자)로 적는다.
# 빌드 경고("한국어 이름 없음")에 나온 이름을 여기에 추가하면 된다.
# species: 종 하나의 전체 이름 / formes: 폼 이름(Showdown의 forme 값) → "기본 이름(폼 이름)"으로 붙는다
species:
  # Showdown 한국어 데이터에 기본 이름이 비어 있는 종
