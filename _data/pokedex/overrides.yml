  necrozmadawnwings: 네크로즈마(새벽의 날개)
  lycanrocmidnight: 루가루암(한밤중의 모습)
  lycanrocdusk: 루가루암(황혼의 모습)
  toxtricitylowkey: 스트린더(로우한 모습)
  urshifurapidstrike: 우라오스(연격의 태세)
  ogerponwellspring: 오거폰(우물의 가면)
  ogerponhearthflame: 오거폰(화덕의 가면)
  ogerponcornerstone: 오거폰(주춧돌의 가면)
  floetteeternal: 플라엣테(영원의 꽃)
  floettemega: 메가플라엣테
